server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mantém rotas do React funcionando ao atualizar a página.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Evita o problema de precisar usar Ctrl+F5 após novo deploy.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # Assets gerados pelo Vite possuem hash no nome e podem ficar em cache.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
}
